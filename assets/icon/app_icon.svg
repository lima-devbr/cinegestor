<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fundo cinematográfico Apple -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="35%" stop-color="#003B95"/>
      <stop offset="70%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grafite Nobre / Gunmetal para a Poltrona -->
    <linearGradient id="graphiteBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="graphiteLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Sombras para efeito de camadas (Depth Layering) -->
    <filter id="shadowChair" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020C1E" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Apple -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#topGlow)"/>
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- POLTRONA EM GRAFITE NOBRE (Centralizada na composição) -->
  <g filter="url(#shadowChair)">
    <!-- Encosto de Cabeça em Grafite -->
    <rect x="180" y="128" width="152" height="46" rx="18" fill="url(#graphiteLight)"/>
    <rect x="182" y="130" width="148" height="42" rx="16" fill="none" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Encosto Principal em Grafite com relevo -->
    <rect x="168" y="186" width="176" height="142" rx="24" fill="url(#graphiteBody)"/>
    <rect x="170" y="188" width="172" height="138" rx="22" fill="none" stroke="#64748B" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Linhas ergonômicas de costura em relevo fosco -->
    <line x1="226" y1="200" x2="226" y2="314" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    <line x1="228" y1="200" x2="228" y2="314" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>

    <line x1="284" y1="200" x2="284" y2="314" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    <line x1="286" y1="200" x2="286" y2="314" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Apoio de Braço Esquerdo -->
    <rect x="124" y="252" width="34" height="102" rx="16" fill="url(#graphiteLight)"/>
    <rect x="126" y="254" width="30" height="98" rx="14" fill="none" stroke="#64748B" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Apoio de Braço Direito -->
    <rect x="354" y="252" width="34" height="102" rx="16" fill="url(#graphiteLight)"/>
    <rect x="356" y="254" width="30" height="98" rx="14" fill="none" stroke="#64748B" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Assento Acolchoado VIP -->
    <rect x="160" y="338" width="192" height="58" rx="20" fill="url(#graphiteLight)"/>
    <rect x="162" y="340" width="188" height="54" rx="18" fill="none" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="176" y="344" width="160" height="6" rx="3" fill="#0F172A" opacity="0.4"/>

    <!-- Base / Coluna de fixação no piso -->
    <path d="M 234 396 L 278 396 L 288 436 L 224 436 Z" fill="#0B1324"/>
    <rect x="200" y="432" width="112" height="14" rx="7" fill="url(#accentCyan)"/>
  </g>
</svg>
