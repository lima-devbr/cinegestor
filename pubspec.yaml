name: cinegestor
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  package_info_plus: ^8.2.0
  dio: ^5.7.0
  open_filex: ^4.5.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  web: ^1.1.0
  pdf: ^3.12.0
  printing: ^5.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/cinemas/uci_park_campo_grande/
    - assets/cinemas/uci_new_york_city_center/
    - assets/cinemas/uci_norte_shopping/
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
